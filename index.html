<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>LMD form v02</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Report">
<style>
:root{--bg:#f7f5f1;--tx:#151515;--mu:#80807a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--tx:#ececec;--mu:#9a9a94}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
#root{height:100%;display:flex;flex-direction:column}
button,select,input{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script>
function rpNorm(s){return String(s||'').replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').toLowerCase()}
var RPT={'م':1,'ا':1,'د':1,'عقيد':1,'لواء':1,'مقدم':1,'رائد':1,'نقيب':1,'دكتور':1,'استاذ':1,'مشرف':1,'اداري':1,'مهندس':1,'عميد':1};
function rpToks(s){return rpNorm(s).replace(/[^ا-يa-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w&&!RPT[w]}).map(function(w){w=w.replace(/ي+$/,'ي');return(w.indexOf('ال')==0&&w.length>=5)?w.slice(2):w})}
function cyrb53(str,seed){var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function sfCanon(o){var tk=function(s){return rpToks(s).join('')},pn=function(s){return rpNorm(s).replace(/[^ا-يa-z0-9]/g,'').replace(/\d+$/,'')};
  return JSON.stringify({d:o.d,s:o.s,u:tk(o.u||''),p:o.p.map(function(x){return tk(x[0])+'~'+pn(x[1])+'~'+(x[2]?1:0)}).sort(),l:o.l.map(function(x){return tk(x[0])+'~'+x[1]}).sort()})}
function sfCode(K,o){return('000000'+cyrb53(K+'|'+sfCanon(o),7).toString(36).toUpperCase()).slice(-6)}
function sfCap(po,sh){var n=rpNorm(po).replace(/[^ا-يa-z0-9]/g,'').replace(/^ال/,'');if(!n||n=='غيرمحدد')return 99;if(/^بوابه/.test(n)||n=='اداري')return 99;if(/lms/.test(n))return sh=='N'?2:1;return 1}

/* ===== LMD form: supervisor's shift report (standalone page - no app code, no login, no database) ===== */
var SF=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function err(m,c,ms){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;padding:10px 16px;border-radius:12px;background:'+(c||'#d64545')+';color:#fff;font-size:14px;z-index:100000;text-align:center';document.body.appendChild(t);setTimeout(function(){t.remove()},ms||3500)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function sfB64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var b=atob(t),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function sfUnpack(t){var k=t.slice(0,2),u=sfB64d(t.slice(2));
  if(k=='j.')return Promise.resolve(JSON.parse(new TextDecoder().decode(u)));
  var ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u);w.close();
  return new Response(ds.readable).arrayBuffer().then(function(b){return JSON.parse(new TextDecoder().decode(new Uint8Array(b)))})}
function sfShare(text){
  if(navigator.share){navigator.share({text:text}).catch(function(e){if(!e||e.name!='AbortError')window.open('https://wa.me/?text='+encodeURIComponent(text))})}
  else window.open('https://wa.me/?text='+encodeURIComponent(text))}
function sfCopy(text,done){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,function(){err('اضغط مطولاً على النص لنسخه','#8a8a82',3000)});else err('اضغط مطولاً على النص لنسخه','#8a8a82',3000)}
var SFST=[['P','حاضر','#2f9e5b'],['V','إجازة','#2f6fed'],['Z','مرضي','#8a4fd6'],['C','عارضة','#d28a00'],['A','غياب','#d64545']],SFDAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function sfPad(n){return n<10?'0'+n:''+n}
function sfDkOf(d){return d.getFullYear()+'-'+sfPad(d.getMonth()+1)+'-'+sfPad(d.getDate())}
function sfKey(){return'lmd_sf_d_'+SF.dk+'_'+SF.sh}
function sfLoad(){var o=null;try{o=JSON.parse(lsGet(sfKey())||'null')}catch(e){}SF.rows=o&&o.rows?o.rows:{};SF.sup=o&&o.sup!=null?o.sup:((SF.data.S||{})[SF.sh]||'');SF.extra=o&&o.extra?o.extra:{};SF.dsAll=!!(o&&o.dsAll)}
function sfSave(){lsSet(sfKey(),JSON.stringify({rows:SF.rows,sup:SF.sup,extra:SF.extra,dsAll:SF.dsAll?1:0}))}
function sfPosts(){var cp=[];try{cp=JSON.parse(lsGet('lmd_sf_cp')||'[]')}catch(e){}var P=(SF.data.P||[]).slice();cp.forEach(function(p){if(P.indexOf(p)<0)P.push(p)});return P}
function sfDP(){var dp={};if(SF.sh!='N')return dp;try{var o=JSON.parse(lsGet('lmd_sf_d_'+SF.dk+'_D')||'null');if(o&&o.rows)Object.keys(o.rows).forEach(function(id){if(o.rows[id]&&o.rows[id].s=='P')dp[id]=1})}catch(e){}return dp}
function sfCnt(po,ex){var n=0;SF.all.forEach(function(id){var r=SF.rows[id]||{};if(id!=ex&&r.s=='P'&&r.po==po)n++});return n}
function sfOk(po,id){return!po||sfCnt(po,id)<sfCap(po,SF.sh)}
function sfCalc(){
  var N=SF.sh=='N';SF.dp=sfDP();
  SF.pool=N?SF.data.L.filter(function(x){return x[0]!=SF.sup&&x[2]!=1&&(SF.dp[x[0]]||SF.dsAll)}).map(function(x){return x[0]}):[];
  SF.mem=SF.data.L.filter(function(x){return x[0]!=SF.sup&&SF.pool.indexOf(x[0])<0&&((x[2]==1)==N||SF.extra[x[0]])}).map(function(x){return x[0]});
  SF.all=SF.mem.concat(SF.pool)}
function sfCanDs(id){return SF.sh=='N'&&!!(SF.dp[id]||SF.dsAll)}
function sfR(i){var id=SF.all[i];return SF.rows[id]||(SF.rows[id]={})}
function sfS(i,s){var r=sfR(i);if(r.s==s)delete r.s;else{r.s=s;if(s=='P'&&!r.po){var m=lsGet('lmd_sf_p_'+SF.all[i]);if(m&&sfOk(m,SF.all[i]))r.po=m}}if(r.s!='P'){r.ds=0;r.rd=0}sfSave();sfDraw()}
function sfPT(i){var id=SF.all[i],r=SF.rows[id];if(r&&r.s=='P')delete SF.rows[id];else{SF.rows[id]={s:'P',ds:1};var m=lsGet('lmd_sf_p_'+id);if(m&&sfOk(m,id))SF.rows[id].po=m}sfSave();sfDraw()}
function sfPo(i,v){var r=sfR(i);if(v=='__o'){v=prompt('اسم الموقع الجديد');if(v)v=v.trim();if(!v)return sfDraw();var cp=[];try{cp=JSON.parse(lsGet('lmd_sf_cp')||'[]')}catch(e){}if(cp.indexOf(v)<0&&(SF.data.P||[]).indexOf(v)<0){cp.push(v);lsSet('lmd_sf_cp',JSON.stringify(cp))}}if(v&&!sfOk(v,SF.all[i])){err('هذا الموقع مكتمل في هذه الوردية');return sfDraw()}r.po=v;lsSet('lmd_sf_p_'+SF.all[i],v);sfSave();sfDraw()}
function sfCk(i,k,v){sfR(i)[k]=v?1:0;sfSave()}
function sfAll(){SF.mem.forEach(function(id){var r=SF.rows[id]||(SF.rows[id]={});if(!r.s){r.s='P';if(!r.po){var m=lsGet('lmd_sf_p_'+id);if(m&&sfOk(m,id))r.po=m}}});sfSave();sfDraw()}
function sfAdd(id){if(id){SF.extra[id]=1;sfSave();sfDraw()}}
function sfSup(v){SF.sup=v;sfSave();sfDraw()}
function sfDsAll(){SF.dsAll=!SF.dsAll;sfSave();sfDraw()}
function sfHdr(f,v){if(f=='s')SF.sh=v;else{var p=v.split('-');if(p.length!=3)return;SF.date=new Date(+p[0],+p[1]-1,+p[2]);SF.dk=sfDkOf(SF.date)}sfLoad();sfDraw()}
function sfReset(){if(!confirm('مسح كل ما تم إدخاله لهذا اليوم وهذه الوردية؟'))return;SF.rows={};SF.extra={};SF.dsAll=false;SF.sup=(SF.data.S||{})[SF.sh]||'';sfSave();sfDraw()}
function sfTime(d){var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'م':'ص';h=h%12||12;return sfPad(h)+':'+sfPad(m)+' '+ap}
function sfText(){
  var sh=SF.sh,P=sfPosts(),pres=[],lv=[],ab=[],nm={},dd=SF.date,now=new Date();
  SF.data.L.forEach(function(x){nm[x[0]]=x[1]});
  SF.all.forEach(function(id){var r=SF.rows[id]||{};if(r.s=='P')pres.push({id:id,r:r,po:r.po||'غير محدد',ds:!!r.ds});else if(r.s=='V'||r.s=='Z'||r.s=='C')lv.push({id:id,t:r.s});else if(r.s=='A')ab.push(id)});
  var nF=pres.filter(function(p){return!p.ds}).length,nT=pres.length-nF,BAR='━━━━━━━━━━━━━━━━━━━━';
  var n=(+lsGet('lmd_sf_n')||0)+1;lsSet('lmd_sf_n',String(n));var rn=('0000'+n).slice(-4);
  var L=[BAR,'📋 تقرير الوردية',BAR,'📅 '+SFDAYS[dd.getDay()]+' '+sfPad(dd.getDate())+'/'+sfPad(dd.getMonth()+1)+'/'+dd.getFullYear(),'🕘 الوردية : '+(sh=='D'?'الصباحية':'الليلية'),'⏱ وقت الإرسال : '+sfTime(now),BAR];
  if(SF.sup&&nm[SF.sup])L.push('👮 مشرف/ '+nm[SF.sup]);
  var gr={},ord=[];pres.forEach(function(p){if(!gr[p.po]){gr[p.po]=[];ord.push(p.po)}gr[p.po].push(p)});
  ord.sort(function(a,b){var x=P.indexOf(a),y=P.indexOf(b);return(x<0?999:x)-(y<0?999:y)});
  ord.forEach(function(po){L.push('');L.push('📍 '+po);gr[po].forEach(function(p,i){L.push((i+1)+'- '+nm[p.id]+' ✔️'+(p.ds?' ( تطبيق)':''));if(p.r.rd)L.push('( تم استلام جهاز لاسلكي)')})});
  L.push('',BAR,'عدد الأفراد : '+nF,'عدد التطبيق : '+nT,'إجمالي الأفراد : '+(nF+nT),BAR);
  if(lv.length){L.push('🟦 اجازة');lv.forEach(function(x){L.push(nm[x.id]+(x.t=='Z'?' (مرضي)':x.t=='C'?' (عارضة)':''))})}
  if(ab.length){L.push('🟥 غياب');ab.forEach(function(id){L.push(nm[id])})}
  if(lv.length||ab.length)L.push(BAR);
  var o={d:SF.dk,s:sh,u:SF.sup&&nm[SF.sup]||'',p:pres.map(function(p){return[nm[p.id],p.po,p.ds]}),l:lv.map(function(x){return[nm[x.id],x.t]}).concat(ab.map(function(id){return[nm[id],'A']}))};
  L.push('رقم التقرير : '+rn);
  if(SF.data.k)L.push('كود التحقق : '+sfCode(SF.data.k,o));
  return L.join('\n')}
function sfCounts(){var c={f:0,t:0,L:0,A:0,U:0,np:0};SF.all.forEach(function(id){var r=SF.rows[id]||{},s=r.s,isPool=SF.pool.indexOf(id)>=0;
  if(s=='P'){if(r.ds)c.t++;else c.f++;if(!r.po)c.np++}else if(s=='V'||s=='Z'||s=='C')c.L++;else if(s=='A')c.A++;else if(!isPool)c.U++});return c}
function sfSend(){var c=sfCounts();if(!c.f&&!c.t&&!c.L&&!c.A){err('حدد حالة شخص واحد على الأقل','#8a8a82',2500);return}
  if(c.np&&!confirm(c.np+' أفراد بدون موقع وسيُكتب لهم "غير محدد". إرسال؟'))return;
  if(c.U&&!confirm(c.U+' أفراد بدون حالة ولن يظهروا في التقرير. إرسال؟'))return;
  sfShare(sfText())}
function sfDraw(){
  sfCalc();var b=$('sfb'),y=b.scrollTop,P=sfPosts(),h='',inp='padding:8px;font-size:15px;background:var(--bg);color:var(--tx);border:1px solid var(--mu);border-radius:8px;max-width:100%';
  var postSel=function(i,r){var po=r.po||'',has=!po||P.indexOf(po)>=0;return'<select dir="auto" style="'+inp+(po?'':';border-color:#d64545')+'" onchange="sfPo('+i+',this.value)"><option value="">— الموقع —</option>'+P.filter(function(p){return p==po||sfOk(p,SF.all[i])}).map(function(p){return'<option value="'+esc(p)+'"'+(po==p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+(has?'':'<option value="'+esc(po)+'" selected>'+esc(po)+'</option>')+'<option value="__o">➕ موقع جديد…</option></select>'};
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><input type="date" value="'+SF.dk+'" style="'+inp+'" onchange="sfHdr(\'d\',this.value)"><select style="'+inp+'" onchange="sfHdr(\'s\',this.value)"><option value="D"'+(SF.sh=='D'?' selected':'')+'>الوردية الصباحية (D)</option><option value="N"'+(SF.sh=='N'?' selected':'')+'>الوردية الليلية (N)</option></select></div>';
  h+='<div style="font-weight:700;margin-top:6px">المشرف</div><select dir="auto" style="'+inp+';width:100%" onchange="sfSup(this.value)"><option value="">— بدون —</option>'+SF.data.L.map(function(x){return'<option value="'+esc(x[0])+'"'+(SF.sup==x[0]?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')+'</select>';
  h+='<div style="display:flex;gap:8px;align-items:center;margin-top:12px"><b style="flex:1">الأفراد ('+SF.mem.length+')</b><button style="'+inp+';font-weight:600" onclick="sfAll()">✅ الكل حاضر</button></div>';
  SF.all.forEach(function(id,i){
    if(SF.pool.indexOf(id)>=0)return;
    var x=SF.data.L.filter(function(q){return q[0]==id})[0],r=SF.rows[id]||{};
    h+='<div style="border-inline-start:4px solid '+(r.s?(SFST.filter(function(q){return q[0]==r.s})[0]||[0,0,'#888'])[2]:'#8a8a82')+';padding:8px 10px;margin:6px 0;background:rgba(128,128,128,.13);border-radius:8px"><div dir="auto" style="font-weight:700">'+esc(x[1])+'</div><div style="display:flex;gap:4px;margin:6px 0">';
    SFST.forEach(function(q){var on=r.s==q[0];h+='<button onclick="sfS('+i+',\''+q[0]+'\')" style="flex:1;padding:9px 2px;font:inherit;font-size:14px;font-weight:600;border-radius:8px;border:1px solid '+q[2]+';background:'+(on?q[2]:'transparent')+';color:'+(on?'#fff':'inherit')+'">'+q[1]+'</button>'});
    h+='</div>';
    if(r.s=='P')h+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+postSel(i,r)+(sfCanDs(id)?'<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" '+(r.ds?'checked ':'')+'onchange="sfCk('+i+',\'ds\',this.checked)"> تطبيق</label>':'')+'<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" '+(r.rd?'checked ':'')+'onchange="sfCk('+i+',\'rd\',this.checked)"> 📻 لاسلكي</label></div>';
    h+='</div>'});
  if(SF.sh=='N'){
    h+='<div style="display:flex;gap:8px;align-items:center;margin-top:14px"><b style="flex:1">من الصباحي - تطبيق ('+SF.pool.length+')</b><button style="'+inp+'" onclick="sfDsAll()">'+(SF.dsAll?'إخفاء':'عرض كل الصباحي')+'</button></div>';
    if(!SF.pool.length)h+='<div style="color:var(--mu);font-size:13px;margin:4px 0">لا يوجد أحد مسجل حاضراً في تقرير الصباحي لهذا اليوم على هذا الهاتف. اضغط "عرض كل الصباحي" لاختيار أي فرد.</div>';
    SF.all.forEach(function(id,i){
      if(SF.pool.indexOf(id)<0)return;
      var x=SF.data.L.filter(function(q){return q[0]==id})[0],r=SF.rows[id]||{},on=r.s=='P';
      h+='<div style="border-inline-start:4px solid '+(on?'#2f9e5b':'#8a8a82')+';padding:8px 10px;margin:6px 0;background:rgba(128,128,128,.13);border-radius:8px"><div style="display:flex;gap:8px;align-items:center"><div dir="auto" style="font-weight:700;flex:1">'+esc(x[1])+'</div><button onclick="sfPT('+i+')" style="padding:8px 14px;font:inherit;font-size:14px;font-weight:600;border-radius:8px;border:1px solid #2f9e5b;background:'+(on?'#2f9e5b':'transparent')+';color:'+(on?'#fff':'inherit')+'">'+(on?'✓ تطبيق':'تطبيق')+'</button></div>'+(on?'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">'+postSel(i,r)+'<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" '+(r.rd?'checked ':'')+'onchange="sfCk('+i+',\'rd\',this.checked)"> 📻 لاسلكي</label></div>':'')+'</div>'})}
  var oth=SF.data.L.filter(function(x){return x[0]!=SF.sup&&SF.all.indexOf(x[0])<0});
  if(oth.length)h+='<div style="margin-top:12px;font-weight:700">إضافة فرد من وردية أخرى</div><select dir="auto" style="'+inp+';width:100%" onchange="sfAdd(this.value)"><option value="">— اختر —</option>'+oth.map(function(x){return'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>'}).join('')+'</select>';
  h+='<div style="display:flex;gap:16px;margin:16px 0 6px;font-size:13px"><a style="text-decoration:underline;cursor:pointer" onclick="sfReset()">مسح الكل</a></div><div style="color:var(--mu);font-size:11px;margin:8px 0 12px">LMD form v02</div>';
  b.innerHTML=h;b.scrollTop=y;
  var c=sfCounts();$('sfc').textContent='الأفراد '+c.f+' · التطبيق '+c.t+' · الإجمالي '+(c.f+c.t)+' | إجازات '+c.L+' · غياب '+c.A+(c.U?' · بدون حالة '+c.U:'')}
function sfOpen(data){
  if(!data||!data.L){return}
  SF={data:data,extra:{},rows:{}};
  var n=new Date(),h=n.getHours(),d=new Date(n);SF.sh=(h>=5&&h<16)?'D':'N';if(h<5)d.setDate(d.getDate()-1);
  SF.date=d;SF.dk=sfDkOf(d);sfLoad();
  $('root').innerHTML='<div style="padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;font-weight:700;font-size:18px">📋 تقرير الوردية</div><div id="sfb" style="flex:1;overflow:auto;padding:0 14px 10px;-webkit-overflow-scrolling:touch"></div><div style="padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(128,128,128,.3)"><div id="sfc" style="font-size:13px;color:var(--mu);margin-bottom:6px"></div><div style="display:flex;gap:8px"><button id="sfk" style="flex:1;padding:12px;border-radius:12px;border:1px solid #888;background:transparent;color:inherit;font:inherit;font-weight:600">نسخ</button><button id="sfs" style="flex:2;padding:12px;border-radius:12px;border:0;background:#2f6fed;color:#fff;font:inherit;font-weight:700">إرسال ▶</button></div></div>';
  $('sfs').onclick=sfSend;$('sfk').onclick=function(){sfCopy(sfText(),function(){err('تم النسخ','#2f9e5b',1500)})};
  sfDraw()}
function sfEmpty(m){$('root').innerHTML='<div style="padding:40px 24px;text-align:center;line-height:1.7">'+m+'</div>'}
function sfBoot(){
  var m=(location.hash||'').match(/^#sf=(.+)$/);
  if(m){sfUnpack(m[1]).then(function(d){lsSet('lmd_sf',m[1]);sfOpen(d)},function(){sfEmpty('الرابط غير صالح.<br>اطلب رابطاً جديداً.')});return}
  var s=lsGet('lmd_sf');
  if(s)sfUnpack(s).then(sfOpen,function(){sfEmpty('اطلب رابطاً جديداً.')});
  else sfEmpty('افتح الرابط الذي وصلك.')}
sfBoot();

</script>
</body>
</html>
